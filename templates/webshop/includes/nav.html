<header id="luxHeader" class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b transition-colors">


  <div class="max-w-7xl mx-auto px-4 md:px-8">
    <div class="flex items-center justify-between h-20">
      <!-- brand (left) -->
      <a href="/" class="text-2xl md:text-3xl tracking-[0.2em] font-medium">{{ brand }}</a>

      <!-- desktop menu -->
      <nav class="hidden md:flex items-center gap-8">
        {% for label, href in nav_items %}
          <a href="{{ href }}" class="tracking-wider py-4">{{ label }}</a>
        {% empty %}
          <span class="text-xs text-neutral-400">no nav_items</span>
        {% endfor %}
      </nav>

      <!-- hamburger (mobile, now on right) -->
      <button class="md:hidden" id="openNav" aria-label="Open menu">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- right-side mobile drawer -->
  <div
    id="mobileNav"
    class="fixed inset-y-0 right-0 w-[88%] max-w-sm bg-white shadow-2xl z-50 translate-x-full transition-transform duration-300 ease-out hidden"
    aria-hidden="true"
  >
    <div class="sticky top-0 bg-white border-b px-5 h-14 flex items-center justify-between">
      <span class="tracking-[0.2em] text-xs text-neutral-600">MENU</span>
      <button id="closeNav" aria-label="Close menu" class="p-2 -mr-2">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <nav class="px-5 py-4">
      <a class="block py-3 border-b hover:bg-neutral-50" href="#">High Jewelry</a>
      <a class="block py-3 border-b hover:bg-neutral-50" href="#">Watches</a>
      <a class="block py-3 border-b hover:bg-neutral-50" href="#">Bridal</a>
      <a class="block py-3 hover:bg-neutral-50" href="#">Stories</a>
    </nav>
  </div>




  <!-- backdrop -->
  <div
    id="mobileNavBackdrop"
    class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden"
    aria-hidden="true"
  ></div>

  <script>
    // Header glass effect on scroll
    (function () {
        const h = document.getElementById('luxHeader');
        if (!h) return;
        const onScroll = () => {
        const scrolled = window.scrollY > 10;
        h.classList.toggle('bg-white/90', scrolled);
        h.classList.toggle('border-b', scrolled);
        h.classList.toggle('backdrop-blur', scrolled);
        };
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
    })();
    </script>
</header>
